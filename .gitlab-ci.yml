stages:
  - test

lint:
  stage: test
  image: ubuntu:22.04
  tags:
    - ubuntu-test-runner
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends shellcheck
    - shellcheck --severity=warning auto-update.sh
  only:
    - master
    - merge_requests

smoke-test:
  stage: test
  image: ubuntu:22.04
  tags:
    - ubuntu-test-runner
  script:
    - echo "== syntax check =="
    - bash -n auto-update.sh

    # Stub apt/reboot so the state-machine logic (dispatch on
    # /var/lib/update-script/progress, phased-update fallback, reboot
    # handling) can be exercised without touching real packages or
    # actually rebooting the runner. /usr/local/bin is earlier in PATH
    # than /usr/bin, so these shadow the real apt. There is deliberately no sudo in
    # the image: the script runs as root and must not need it (sudo can be autoremoved).
    - mkdir -p /usr/local/bin /var/run /var/lib/update-script
    - |
      cat > /usr/local/bin/apt <<'STUB'
      #!/bin/bash
      echo "apt $*" >> /tmp/apt-raw.log
      line="apt $*"
      line="${line// -o DPkg::Lock::Timeout=600 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold/}"
      echo "$line" >> /tmp/apt.log
      if [ -n "${FAKE_FAIL:-}" ] && [ "$line" = "$FAKE_FAIL" ]; then exit 100; fi
      if [[ "$*" == *"list --upgradable"* ]]; then
        echo "Listing..."
        n="${FAKE_UPGRADABLE_COUNT:-0}"
        i=1
        while [ "$i" -le "$n" ]; do
          echo "pkg$i/jammy 1.0.$i amd64 [upgradable from: 1.0.0]"
          i=$((i+1))
        done
      fi
      if [ "$line" = "apt upgrade -y" ] && [ "${SIMULATE_REBOOT_AFTER_UPGRADE:-0}" = "1" ]; then
        touch /var/run/reboot-required
      fi
      exit 0
      STUB
    - chmod +x /usr/local/bin/apt
    - |
      cat > /usr/local/bin/reboot <<'STUB'
      #!/bin/bash
      echo "reboot called: $*" >> /tmp/reboot.log
      exit 0
      STUB
    - chmod +x /usr/local/bin/reboot

    - 'echo "== test 1: full clean run, no reboot required, no phased packages =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - test ! -f /tmp/reboot.log
    - grep -qxF "apt upgrade -y" /tmp/apt.log
    - grep -qxF "apt dist-upgrade -y" /tmp/apt.log
    - grep -qxF "apt autoremove -y" /tmp/apt.log
    - grep -qxF "apt autoclean" /tmp/apt.log
    - '! grep -q -- "-o APT::Get::Always-Include-Phased-Updates=true" /tmp/apt.log'

    - 'echo "== test 2: full clean run, phased packages present =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - FAKE_UPGRADABLE_COUNT=2 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - grep -q -- "-o APT::Get::Always-Include-Phased-Updates=true upgrade -y" /tmp/apt.log
    - grep -q -- "-o APT::Get::Always-Include-Phased-Updates=true dist-upgrade -y" /tmp/apt.log
    - grep -q -- "install -y pkg1" /tmp/apt.log
    - grep -q -- "install -y pkg2" /tmp/apt.log

    - 'echo "== test 3: reboot required before any updates run =="'
    - rm -f /var/lib/update-script/progress /tmp/apt.log /tmp/reboot.log
    - touch /var/run/reboot-required
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test -f /tmp/reboot.log
    - grep -qxF "step1_reboot" /var/lib/update-script/progress
    - test ! -f /tmp/apt.log
    - rm -f /var/run/reboot-required

    - 'echo "== test 4: reboot required mid-cascade (after the upgrade step) =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - FAKE_UPGRADABLE_COUNT=0 SIMULATE_REBOOT_AFTER_UPGRADE=1 bash auto-update.sh
    - test -f /tmp/reboot.log
    - grep -qxF "step1_reboot" /var/lib/update-script/progress
    - grep -qxF "apt upgrade -y" /tmp/apt.log
    - '! grep -qxF "apt autoremove -y" /tmp/apt.log'
    - rm -f /var/run/reboot-required

    - 'echo "== test 5: resume from step2_updates skips step2''s own update/upgrade =="'
    - rm -f /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo step2_updates > /var/lib/update-script/progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - '! grep -qxF "apt upgrade -y" /tmp/apt.log'
    - grep -qxF "apt dist-upgrade -y" /tmp/apt.log
    - grep -qxF "apt autoremove -y" /tmp/apt.log

    - 'echo "== test 6: resume from step3_kept_back skips step2 and step3 =="'
    - rm -f /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo step3_kept_back > /var/lib/update-script/progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - '! grep -qxF "apt upgrade -y" /tmp/apt.log'
    - '! grep -qxF "apt dist-upgrade -y" /tmp/apt.log'
    - grep -qxF "apt autoremove -y" /tmp/apt.log

    - 'echo "== test 7: resume from step4_phased skips straight to cleanup =="'
    - rm -f /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo step4_phased > /var/lib/update-script/progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - '! grep -qxF "apt upgrade -y" /tmp/apt.log'
    - '! grep -qxF "apt dist-upgrade -y" /tmp/apt.log'
    - grep -qxF "apt autoremove -y" /tmp/apt.log

    - 'echo "== test 8: resume from step1_reboot re-runs update/upgrade (unlike step2_updates) =="'
    - rm -f /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo step1_reboot > /var/lib/update-script/progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - grep -qxF "apt upgrade -y" /tmp/apt.log
    - grep -qxF "apt dist-upgrade -y" /tmp/apt.log

    - 'echo "== test 9: unknown progress value falls back to a fresh run =="'
    - rm -f /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo bogus_state > /var/lib/update-script/progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - test ! -f /var/lib/update-script/progress
    - grep -qxF "apt upgrade -y" /tmp/apt.log
    - grep -qxF "apt dist-upgrade -y" /tmp/apt.log
    - 'echo "== test 10: package-changing apt calls wait for the lock and keep config files =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/apt-raw.log /tmp/reboot.log
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - grep -qxF "apt -o DPkg::Lock::Timeout=600 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold upgrade -y" /tmp/apt-raw.log

    - 'echo "== test 11: a failed apt step is reported and the run exits non-zero =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - set +e; FAKE_UPGRADABLE_COUNT=0 FAKE_FAIL="apt dist-upgrade -y" bash auto-update.sh > /tmp/run.log 2>&1; rc=$?; set -e; test "$rc" -eq 1
    - grep -q "finished with 1 failed apt step" /tmp/run.log
    - '! grep -q "completed successfully" /tmp/run.log'
    - test ! -f /var/lib/update-script/progress
    - 'echo "== test 12: a failure before a reboot is still reported after the resume =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log /var/lib/update-script/errors
    - FAKE_UPGRADABLE_COUNT=0 FAKE_FAIL="apt dist-upgrade -y" SIMULATE_REBOOT_AFTER_UPGRADE=1 bash auto-update.sh
    - test -f /tmp/reboot.log
    - rm -f /var/run/reboot-required
    - set +e; FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh > /tmp/run.log 2>&1; rc=$?; set -e; test "$rc" -eq 1
    - grep -q "finished with 1 failed apt step" /tmp/run.log
    - test ! -f /var/lib/update-script/errors

    - 'echo "== test 13: a failed apt update is counted =="'
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log /var/lib/update-script/errors
    - set +e; FAKE_UPGRADABLE_COUNT=0 FAKE_FAIL="apt update" bash auto-update.sh > /tmp/run.log 2>&1; rc=$?; set -e; test "$rc" -ge 1
    - grep -q "failed apt step" /tmp/run.log

    - 'echo "== test 14: progress left in /var/log by an older version is picked up, then removed =="'
    - rm -f /var/lib/update-script/progress /var/log/update-script-progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log
    - echo step3_kept_back > /var/log/update-script-progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - '! grep -qxF "apt upgrade -y" /tmp/apt.log'
    - grep -qxF "apt autoremove -y" /tmp/apt.log
    - test ! -e /var/log/update-script-progress
    - test ! -e /var/lib/update-script/progress

    - 'echo "== test 15: a symlink planted at the old /var/log path is not followed =="'
    - rm -f /var/lib/update-script/progress /var/log/update-script-progress /tmp/apt.log /tmp/reboot.log /tmp/victim
    - echo untouched > /tmp/victim
    - ln -s /tmp/victim /var/log/update-script-progress
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - grep -qxF "apt upgrade -y" /tmp/apt.log
    - test ! -e /var/log/update-script-progress
    - test "$(cat /tmp/victim)" = untouched

    - 'echo "== test 16: a container with a stale docker.sock mount is restarted; a fresh one is left =="'
    - command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y --no-install-recommends python3 >/dev/null; }
    - rm -f /var/lib/update-script/progress /var/run/reboot-required /tmp/apt.log /tmp/reboot.log /tmp/docker-restart.log
    # A real AF_UNIX socket so the function's [ -S ] guard passes, with a known mtime.
    - python3 -c "import socket,os; p='/var/run/docker.sock'; os.path.exists(p) and os.remove(p); socket.socket(socket.AF_UNIX).bind(p)"
    - touch -d '2026-06-01T00:00:00' /var/run/docker.sock
    # Stub docker: both containers mount the socket; STALE started before the socket mtime, FRESH after.
    - |
      cat > /usr/local/bin/docker <<'STUB'
      #!/bin/bash
      if [ "$1" = "ps" ]; then printf '%s\n' STALE FRESH; exit 0; fi
      if [ "$1" = "inspect" ]; then
        if [ "$2" = "-f" ]; then fmt="$3"; name="$4"; else name="$2"; fmt="$4"; fi
        case "$fmt" in
          *Mounts*)    echo "/var/run/docker.sock" ;;
          *StartedAt*) if [ "$name" = STALE ]; then echo "2026-01-01T00:00:00Z"; else echo "2026-09-01T00:00:00Z"; fi ;;
        esac
        exit 0
      fi
      if [ "$1" = "restart" ]; then echo "$2" >> /tmp/docker-restart.log; exit 0; fi
      exit 0
      STUB
    - chmod +x /usr/local/bin/docker
    - FAKE_UPGRADABLE_COUNT=0 bash auto-update.sh
    - grep -qxF STALE /tmp/docker-restart.log
    - '! grep -qxF FRESH /tmp/docker-restart.log'
    - rm -f /usr/local/bin/docker /var/run/docker.sock
  only:
    - master
    - merge_requests
